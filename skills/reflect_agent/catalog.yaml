# ReflectAgent 可选技能目录
skills:
  - id: core_exit
    title: 退出判定核心
    description: Reflect 权威状态、判定顺序与输出格式
    file: core_exit.md
    always: true
    tags: [core]

  - id: acceptance_audit
    title: 验收进度审计
    description: acceptanceProgress 与 pendingRequirements 的软参考用法
    file: acceptance_audit.md
    always: false
    when: 有验收上下文或 pending 项
    match_any:
      - "验收"
      - "pending"
      - "acceptance"
      - "未满足"
      - "已满足"
    match_fields:
      - acceptanceProgress
      - acceptance
    tags: [acceptance]

  - id: conflict_uncertain
    title: 冲突与不确定
    description: conflict / uncertain 边界与空计划处理
    file: conflict_uncertain.md
    always: false
    when: 证据冲突、空结果或接近轮次上限
    match_any:
      - "冲突"
      - "矛盾"
      - "不确定"
      - "空"
      - "失败"
      - "mismatch"
      - "上限"
      - "maxRounds"
      - "轮次"
    match_fields:
      - evidenceGap
      - maxRounds
      - round
    tags: [conflict, uncertain]

  - id: replan_guidance
    title: 再规划指示
    description: state=replan 时如何写 nextAction 给 Plan
    file: replan_guidance.md
    always: true
    tags: [replan, core]
