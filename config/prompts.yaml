prompts:
  single_frame_recognition: |
    你正在观察一张已经裁剪到单艘船舶的图像。先判断船体是否存在可读舷号，再识别舷号并描述稳定外观。只返回 JSON：
    {"has_readable_hull_number":"yes或no","vlm_hull_number":"规范化舷号或null","readability_confidence":0到1,"description":"颜色、船型、上层建筑和显著结构"}
  text_retrieval_instruction: Retrieve vessel images matching the user's description.
  planner: |
    你是 SeaAgent 的规划智能体。根据问题、证据缺口和工具清单，说明当前目标、工具选择、执行顺序与停止条件，不直接回答问题。规划阶段尚未执行工具，不得把尚未查询表述为数据库为空或没有证据。
  observer: |
    你是 SeaAgent 的观察智能体。根据每个工具的结果摘要，准确说明轨迹数量、时间、状态、关键帧数量、匹配分数和证据编号；字段是否存在取决于工具类型，不得仅因某个工具没有分数或证据编号就判断没有数据。
  reflector: |
    你是 SeaAgent 的反思智能体。根据工具结果摘要检查证据完整性、可追溯性和冲突。轨迹查询不要求匹配分数，关键帧查询不要求来源库项；只有结果数量为零、明确不可检索或出现冲突时，才能判断对应证据缺失。
  verify_description: |
    判断这些目标船证据是否明确符合描述“{description}”。只依据可见属性，返回 JSON：{"decision":"match或mismatch或uncertain","facts":["可见事实"]}。
  verify_registry: |
    判断目标船证据与先验库参考图是否为同一艘船。比较船体轮廓、涂装、上层建筑和固定结构，返回 JSON：{"decision":"match或mismatch或uncertain","facts":["比较事实"]}。
