yolo:
  model: yolov8n.pt
  device: ""
  # 正式输出并写入轨迹记忆的最低检测置信度
  confidence: 0.5
  # 送入跟踪器的最低候选置信度；低分框仅用于续接已有轨迹
  tracking_candidate_confidence: 0.2
  # 检测阶段的重叠框抑制阈值，不是轨迹关联阈值
  iou: 0.5
  classes: [8]
  detect_every_n_frames: 1
  tracker: bytetrack
  tracker_params:
    # 高分检测达到 0.5 后进入主要关联；新轨迹另需达到 0.6
    track_high_thresh: 0.5
    # 低分检测仅用于第二阶段补充关联，不写入轨迹记忆
    track_low_thresh: 0.2
    new_track_thresh: 0.6
    # 暂时丢失后保留原轨迹编号的帧数
    track_buffer: 90
    # 关联距离阈值；0.8 在稳定续接与避免错绑之间更均衡
    match_thresh: 0.8
    fuse_score: true
  appearance_tracking:
    # 开启后自动切换为支持外观重识别的跟踪器
    enabled: false
    appearance_thresh: 0.8
    proximity_thresh: 0.5
    model: auto
